<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STX EDGE — Trading Calculator</title>
<!-- Display and numeric typefaces -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #171812;
    --ink-soft: #24261e;
    --paper: #f1eddf;
    --paper-bright: #faf7ec;
    --paper-muted: #d7d1c0;
    --line-dark: rgba(241, 237, 223, 0.16);
    --line-light: rgba(23, 24, 18, 0.17);
    --muted-dark: #9e9d91;
    --muted-light: #6f7067;
    --lime: #c7f36b;
    --lime-deep: #8ebd32;
    --buy-color: #a9df49;
    --sell-color: #ff755f;
    --shadow: 0 32px 80px rgba(5, 6, 3, 0.34);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    min-width: 320px;
    background: var(--ink);
  }

  body {
    min-height: 100vh;
    width: 100%;
    color: var(--paper);
    font-family: 'Bricolage Grotesque', sans-serif;
    background:
      radial-gradient(circle at 11% 8%, rgba(199, 243, 107, 0.11), transparent 24rem),
      radial-gradient(circle at 92% 86%, rgba(255, 117, 95, 0.09), transparent 27rem),
      var(--ink);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .site-shell {
    width: min(1460px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px clamp(18px, 3.2vw, 52px) 42px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    min-height: 66px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-dark);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    position: relative;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    color: var(--ink);
    background: var(--lime);
    border-radius: 50%;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px rgba(23, 24, 18, 0.25);
  }

  .brand-mark::after {
    content: '';
    position: absolute;
    inset: -5px;
    border: 1px solid rgba(199, 243, 107, 0.38);
    border-radius: 50%;
  }

  .brand-copy {
    display: grid;
    gap: 1px;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  .brand-subtitle {
    color: var(--muted-dark);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .workspace {
    position: relative;
    display: grid;
    grid-template-columns: minmax(310px, 0.72fr) minmax(0, 1.48fr);
    min-height: 590px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 5px 5px 30px 5px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-top: clamp(34px, 5vw, 70px);
  }

  .workspace::after {
    content: 'STX / 01';
    position: absolute;
    right: 20px;
    bottom: 14px;
    color: rgba(23, 24, 18, 0.38);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
  }

  .input-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 32px;
    padding: clamp(28px, 3.3vw, 50px);
    background: var(--ink-soft);
    color: var(--paper);
    overflow: hidden;
  }

  .input-panel::before {
    content: '';
    position: absolute;
    width: 240px;
    height: 240px;
    right: -150px;
    top: 30%;
    border: 1px solid rgba(199, 243, 107, 0.16);
    border-radius: 50%;
    box-shadow: 0 0 0 42px rgba(199, 243, 107, 0.025), 0 0 0 84px rgba(199, 243, 107, 0.025);
  }

  .panel-index {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 44px;
    color: var(--muted-dark);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .panel-index span:last-child {
    color: var(--lime);
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
    color: var(--muted-dark);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .input-group label::after {
    color: rgba(241, 237, 223, 0.35);
    font-size: 9px;
  }

  .input-group:first-of-type label::after { content: 'HIGH'; }
  .input-group:nth-of-type(2) label::after { content: 'LOW'; }

  .input-group input {
    width: 100%;
    padding: 15px 0 14px;
    color: var(--paper-bright);
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(241, 237, 223, 0.28);
    border-radius: 0;
    outline: none;
    font-family: 'DM Mono', monospace;
    font-size: clamp(22px, 2.3vw, 32px);
    font-weight: 500;
    transition: border-color 180ms ease, color 180ms ease;
  }

  .input-group input:focus {
    color: var(--lime);
    border-color: var(--lime);
  }

  .input-group input::-webkit-inner-spin-button,
  .input-group input::-webkit-outer-spin-button {
    appearance: none;
    margin: 0;
  }

  .calc-btn,
  .tg-copy-btn {
    border: 0;
    cursor: pointer;
    transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
  }

  .calc-btn {
    width: 100%;
    margin-top: 9px;
    padding: 18px 20px;
    color: var(--ink);
    background: var(--lime);
    border-radius: 2px 18px 2px 2px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .calc-btn:hover {
    background: #d7ff87;
    transform: translateY(-3px);
  }

  .calc-btn:active,
  .tg-copy-btn:active {
    transform: translateY(0) scale(0.985);
  }

  .calc-btn:focus-visible,
  .tg-copy-btn:focus-visible,
  .input-group input:focus-visible {
    outline: 2px solid var(--lime);
    outline-offset: 4px;
  }

  .stats-box {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(241, 237, 223, 0.14);
    border: 1px solid rgba(241, 237, 223, 0.14);
  }

  .stats-row {
    display: grid;
    gap: 8px;
    padding: 15px;
    background: var(--ink-soft);
  }

  .stats-row .lbl {
    color: var(--muted-dark);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stats-row .val {
    color: var(--lime);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }

  .signals-panel {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-content: stretch;
    min-width: 0;
    padding: clamp(28px, 3.3vw, 50px);
    gap: clamp(22px, 2.4vw, 38px);
  }

  .signals-panel::before {
    content: 'Calculated positions';
    position: absolute;
    top: 19px;
    right: 24px;
    color: var(--muted-light);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .signal-card {
    position: relative;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding-top: 32px;
    animation: cardReveal 520ms cubic-bezier(.2,.7,.2,1) both;
  }

  .signal-card.sell {
    animation-delay: 90ms;
  }

  .signal-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 52px;
    height: 3px;
    background: var(--buy-color);
  }

  .signal-card.sell::before {
    background: var(--sell-color);
  }

  .signal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 28px;
  }

  .signal-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(22px, 2.2vw, 32px);
    font-weight: 700;
    letter-spacing: -0.045em;
  }

  .signal-title::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--buy-color);
  }

  .sell .signal-title::before {
    background: var(--sell-color);
  }

  .signal-code {
    color: var(--muted-light);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
  }

  .signal-rows {
    flex: 1;
    border-top: 1px solid var(--line-light);
  }

  .data-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    min-height: 62px;
    border-bottom: 1px solid var(--line-light);
    transition: padding 180ms ease, background-color 180ms ease;
  }

  .data-row:hover {
    padding-inline: 10px;
    background: rgba(23, 24, 18, 0.035);
  }

  .data-label {
    color: var(--muted-light);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .data-value {
    overflow: hidden;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: clamp(13px, 1.35vw, 17px);
    font-weight: 500;
    text-overflow: ellipsis;
  }

  .tg-copy-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
    padding: 15px 17px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 2px 14px 2px 2px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.035em;
  }

  .tg-copy-btn svg {
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
  }

  .buy .tg-copy-btn:hover {
    background: var(--buy-color);
    border-color: var(--buy-color);
    transform: translateY(-3px);
  }

  .sell .tg-copy-btn:hover {
    background: var(--sell-color);
    border-color: var(--sell-color);
    transform: translateY(-3px);
  }

  .error {
    margin: -5px 0 14px;
    padding: 11px 13px;
    color: #ff9b8b;
    background: rgba(255, 117, 95, 0.08);
    border-left: 2px solid var(--sell-color);
    font-size: 12px;
    font-weight: 600;
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    right: clamp(18px, 3vw, 42px);
    bottom: 28px;
    z-index: 1000;
    max-width: calc(100vw - 36px);
    padding: 14px 18px;
    color: var(--ink);
    background: var(--lime);
    border: 1px solid rgba(23, 24, 18, 0.28);
    border-radius: 2px 14px 2px 2px;
    box-shadow: 0 18px 50px rgba(5, 6, 3, 0.34);
    font-size: 12px;
    font-weight: 800;
    transform: translateY(28px);
    opacity: 0;
    pointer-events: none;
    transition: transform 260ms cubic-bezier(.2,.75,.2,1), opacity 260ms ease;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  @keyframes cardReveal {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 1040px) {
    .workspace {
      grid-template-columns: 1fr;
    }

    .input-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 0.62fr);
      align-items: end;
    }

    .panel-index {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    .stats-box {
      align-self: end;
    }
  }

  @media (max-width: 700px) {
    .site-shell {
      padding: 18px 14px 28px;
    }

    .topbar {
      align-items: flex-start;
    }

    .workspace {
      border-radius: 3px 3px 22px 3px;
      margin-top: 28px;
    }

    .input-panel {
      display: flex;
      padding: 28px 22px 30px;
    }

    .panel-index {
      margin-bottom: 4px;
    }

    .signals-panel {
      grid-template-columns: 1fr;
      padding: 40px 22px 48px;
    }

    .signals-panel::before {
      left: 22px;
      right: auto;
    }

    .signal-card + .signal-card {
      margin-top: 20px;
    }

    .brand-subtitle {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<main class="site-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">STX</span>
      <span class="brand-copy">
        <span class="brand-title">STX EDGE</span>
        <span class="brand-subtitle">Trading calculator</span>
      </span>
    </div>
  </header>

  <section class="workspace" aria-label="Trading signal kalkulyatori">
    <aside class="input-panel">
      <div class="panel-index"><span>01 / Narxlar</span><span>20% offset</span></div>
      <div class="input-content">
        <div class="input-group">
          <label for="p1">1-qiymat (P1)</label>
          <input id="p1" type="number" step="0.0001" value="4391.63" inputmode="decimal">
        </div>

        <div class="input-group">
          <label for="p2">2-qiymat (P2)</label>
          <input id="p2" type="number" step="0.0001" value="4386.17" inputmode="decimal">
        </div>

        <div id="error" class="error hidden"></div>

        <button class="calc-btn" onclick="calculate()">Hisoblash</button>
      </div>

      <div id="statsBox" class="stats-box hidden">
        <div class="stats-row">
          <span class="lbl">Masofa / Risk</span>
          <span class="val" id="distance">--</span>
        </div>
        <div class="stats-row">
          <span class="lbl">Point</span>
          <span class="val" id="points">--</span>
        </div>
      </div>
    </aside>

    <div id="results" class="signals-panel hidden">
      <div class="signal-card buy">
        <div class="signal-header">
          <div class="signal-title">BUY SIGNAL</div>
          <span class="signal-code">LONG / 01</span>
        </div>
        <div class="signal-rows">
          <div class="data-row">
            <span class="data-label">Entry</span>
            <span class="data-value" id="buyEntry"></span>
          </div>
          <div class="data-row">
            <span class="data-label">Stop Loss</span>
            <span class="data-value" id="buySL"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP1 (1:3 RR)</span>
            <span class="data-value" id="buyTP1"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP2 (1:5 RR)</span>
            <span class="data-value" id="buyTP2"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP3 (1:10 RR)</span>
            <span class="data-value" id="buyTP3"></span>
          </div>
        </div>

        <button class="tg-copy-btn" onclick="copyTelegramSignal('BUY')">
          <span>Telegram uchun nusxalash</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 3.75 3.8 10.2c-1.14.45-1.13 1.08-.2 1.36l4.29 1.34 1.64 5.08c.2.56.1.79.7.79.47 0 .67-.21.93-.46l2.08-2.02 4.33 3.2c.8.44 1.37.21 1.57-.74L22 5.25c.29-1.16-.44-1.68-1.5-1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8 12.82 9.52-5.97c.47-.28.9-.13.55.18l-7.86 7.1-.3 3.39" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="signal-card sell">
        <div class="signal-header">
          <div class="signal-title">SELL SIGNAL</div>
          <span class="signal-code">SHORT / 02</span>
        </div>
        <div class="signal-rows">
          <div class="data-row">
            <span class="data-label">Entry</span>
            <span class="data-value" id="sellEntry"></span>
          </div>
          <div class="data-row">
            <span class="data-label">Stop Loss</span>
            <span class="data-value" id="sellSL"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP1 (1:3 RR)</span>
            <span class="data-value" id="sellTP1"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP2 (1:5 RR)</span>
            <span class="data-value" id="sellTP2"></span>
          </div>
          <div class="data-row">
            <span class="data-label">TP3 (1:10 RR)</span>
            <span class="data-value" id="sellTP3"></span>
          </div>
        </div>

        <button class="tg-copy-btn" onclick="copyTelegramSignal('SELL')">
          <span>Telegram uchun nusxalash</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 3.75 3.8 10.2c-1.14.45-1.13 1.08-.2 1.36l4.29 1.34 1.64 5.08c.2.56.1.79.7.79.47 0 .67-.21.93-.46l2.08-2.02 4.33 3.2c.8.44 1.37.21 1.57-.74L22 5.25c.29-1.16-.44-1.68-1.5-1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8 12.82 9.52-5.97c.47-.28.9-.13.55.18l-7.86 7.1-.3 3.39" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast">Telegram signal nusxalandi!</div>

<script>
function fmt(n) {
  return n.toFixed(4);
}

function calculate() {
  const p1 = parseFloat(document.getElementById('p1').value);
  const p2 = parseFloat(document.getElementById('p2').value);
  const error = document.getElementById('error');
  const results = document.getElementById('results');
  const statsBox = document.getElementById('statsBox');

  if (!Number.isFinite(p1) || !Number.isFinite(p2) || p1 === p2) {
    error.textContent = "Iltimos, ikkita turli qiymat kiriting.";
    error.classList.remove('hidden');
    results.classList.add('hidden');
    statsBox.classList.add('hidden');
    return;
  }

  error.classList.add('hidden');

  const D = Math.round((p1 - p2) / 0.001);
  const O = D * 0.20;
  const offset = O * 0.001;

  const buyEntry = p2 + offset;
  const buySL = p2 - offset;
  const buyRisk = Math.abs(buyEntry - buySL);

  const sellEntry = p1 - offset;
  const sellSL = p1 + offset;
  const sellRisk = Math.abs(sellEntry - sellSL);

  const buyTP1 = buyEntry + buyRisk * 3;
  const buyTP2 = buyEntry + buyRisk * 5;
  const buyTP3 = buyEntry + buyRisk * 10;

  const sellTP1 = sellEntry - sellRisk * 3;
  const sellTP2 = sellEntry - sellRisk * 5;
  const sellTP3 = sellEntry - sellRisk * 10;

  document.getElementById('buyEntry').textContent = fmt(buyEntry);
  document.getElementById('buySL').textContent = fmt(buySL);
  document.getElementById('buyTP1').textContent = fmt(buyTP1);
  document.getElementById('buyTP2').textContent = fmt(buyTP2);
  document.getElementById('buyTP3').textContent = fmt(buyTP3);

  document.getElementById('sellEntry').textContent = fmt(sellEntry);
  document.getElementById('sellSL').textContent = fmt(sellSL);
  document.getElementById('sellTP1').textContent = fmt(sellTP1);
  document.getElementById('sellTP2').textContent = fmt(sellTP2);
  document.getElementById('sellTP3').textContent = fmt(sellTP3);

  document.getElementById('distance').textContent = fmt(buyRisk);
  document.getElementById('points').textContent = Math.round(buyRisk / 0.001) + " point";

  results.classList.remove('hidden');
  statsBox.classList.remove('hidden');
}

// Telegram uchun to'liq signal matnini nusxalash funksiyasi
function copyTelegramSignal(type) {
  const distance = document.getElementById('distance').textContent;
  const points = document.getElementById('points').textContent;

  let text = "";

  if (type === 'BUY') {
    const entry = document.getElementById('buyEntry').textContent;
    const sl = document.getElementById('buySL').textContent;
    const tp1 = document.getElementById('buyTP1').textContent;
    const tp2 = document.getElementById('buyTP2').textContent;
    const tp3 = document.getElementById('buyTP3').textContent;

    text = `🟢 BUY SIGNAL | STX EDGE\n\n` +
           `📍 Entry: ${entry}\n` +
           `🚫 Stop Loss: ${sl}\n\n` +
           `🎯 TP1 (1:3): ${tp1}\n` +
           `🎯 TP2 (1:5): ${tp2}\n` +
           `🎯 TP3 (1:10): ${tp3}\n\n` +
           `📊 Risk: ${distance} | ${points}`;
  } else {
    const entry = document.getElementById('sellEntry').textContent;
    const sl = document.getElementById('sellSL').textContent;
    const tp1 = document.getElementById('sellTP1').textContent;
    const tp2 = document.getElementById('sellTP2').textContent;
    const tp3 = document.getElementById('sellTP3').textContent;

    text = `🔴 SELL SIGNAL | STX EDGE\n\n` +
           `📍 Entry: ${entry}\n` +
           `🚫 Stop Loss: ${sl}\n\n` +
           `🎯 TP1 (1:3): ${tp1}\n` +
           `🎯 TP2 (1:5): ${tp2}\n` +
           `🎯 TP3 (1:10): ${tp3}\n\n` +
           `📊 Risk: ${distance} | ${points}`;
  }

  navigator.clipboard.writeText(text).then(() => {
    showToast(`${type} formati Telegram uchun nusxalandi!`);
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

calculate();
</script>
